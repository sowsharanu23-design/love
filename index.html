<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Heart For You</title>
    <style>
        body { 
            background: #12041d; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: center; 
            padding: 30px 15px; 
            margin: 0;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        h1 { 
            color: #b388ff; 
            font-size: 1.8rem;
            animation: pulse 1.5s infinite; 
            position: relative;
            z-index: 10;
        }
        .container { 
            background: rgba(179, 136, 255, 0.07); 
            padding: 20px; 
            border-radius: 20px; 
            max-width: 500px; 
            margin: 20px auto; 
            line-height: 2; 
            font-size: 1.2rem; 
            word-wrap: break-word;
            border: 1px solid rgba(179, 136, 255, 0.2);
            position: relative;
            z-index: 10;
        }
        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.04); } 
            100% { transform: scale(1); } 
        }
        /* Floating Purple Hearts Background Setup */
        .heart {
            position: fixed;
            color: #9c27b0;
            font-size: 24px;
            user-select: none;
            z-index: 1;
            animation: floatUp 6s linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Scroll down to see my heart... 💜</h1>
    
    <div class="container">
        <script>
            document.write(("I love uh my love💋💜 ").repeat(1000));
        </script>
    </div>

    <!-- Purple Heart Generation Script -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💜';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 7000);
        }
        setInterval(createHeart, 300);
    </script>

</body>
</html>
